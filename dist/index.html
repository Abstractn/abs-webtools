<!doctype html>
<html lang="en">
  <head>
    <script id="redirect-guard">
      (() => {
        const originPathName = '/abs-webtools/';
        const targetPathName = '/abs-webtools/dist/';
        const currentPathName = window.location.pathname;
        if(currentPathName === originPathName) {
          window.location = targetPathName;
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" /> <!-- TODO icon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abs WebTools</title>
    <script type="module" crossorigin src="/abs-webtools/dist/assets/index-DXLOEYmI.js"></script>
    <link rel="stylesheet" crossorigin href="/abs-webtools/dist/assets/index-B8fcdM5r.css">
  </head>
  <body cmp="Page">
    <div class="page-background"></div>
    <header cmp="Header">
      <h1 class="header-title">Abs Webtools</h1>
      <div class="header-list -dsk"></div>
      <div class="header-list -mob"></div>
    
      <template id="header-list-item">
        <button data-target-id="[[targetId]]" class="header-list-item">[[label]]</button>
      </template>
    </header>
    <main>
      <view id="ani-calc" cmp="AniCalc" data-title="AniCalc">
        <div class="inputs-wrapper">
          <fieldset>
            <legend>airing start date</legend>
            <component
              cmp="InputDate"
              
            >
              
              <input
                type="date"
                
                js-start
              />
            </component>    </fieldset>
          <fieldset>
            <legend>number of episodes</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="12" 
                js-duration
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
          <fieldset class="disabled">
            <legend>release frequency (days)</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="7" 
                js-release-frequency disabled
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
          <fieldset class="disabled">
            <legend>watch frequency (per day)</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="1" 
                js-watch-frequency disabled
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
        </div>
      
          <button
            class="button button-secondary  "
            js-calculate
          >
              <span class="button-label">CALCULATE</span>
          </button>
      
        <div class="inputs-wrapper">
          <fieldset>
            <legend>begin</legend>
            <component
              cmp="InputText"
              
            >
              
              <input
                type="text"
                
                js-result readonly
              />
            </component>    </fieldset>
          <fieldset>
            <legend>estimated end date</legend>
            <component
              cmp="InputText"
              
            >
              
              <input
                type="text"
                
                js-end readonly
              />
            </component>    </fieldset>
        </div>
      </view>    <view id="binco" cmp="Binco" data-title="BinCo">
        <div class="inputs-wrapper">
          <fieldset>
            <legend>text</legend>
            <component
              cmp="InputArea"
              
            >
              
              <div class="textarea-wrapper">
                <textarea
                  spellcheck="false"
                  js-text
                  
                ></textarea>
              </div>
            </component>    </fieldset>
        </div>
        <div class="buttons-container">
            <button
              class="button button-secondary icon-reverse "
              js-encode
            >
                <div
                  class="micon button-icon"
                  name="chevron-down"
                ></div>      <span class="button-label">ENCODE</span>
            </button>
            <button
              class="button button-secondary  "
              js-decode
            >
                <div
                  class="micon button-icon"
                  name="chevron-up"
                ></div>      <span class="button-label">DECODE</span>
            </button>
        </div>
        <div class="inputs-wrapper">
          <fieldset>
            <legend>code</legend>
            <component
              cmp="InputArea"
              
            >
              
              <div class="textarea-wrapper">
                <textarea
                  spellcheck="false"
                  js-code
                  
                ></textarea>
              </div>
            </component>    </fieldset>
        </div>
      </view>    <view id="proportional-range" cmp="ProportionalRange" data-title="Proportional Range">
        <div class="inputs-wrapper">
          <fieldset>
            <legend>initial range</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="0" 
                js-old-min
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>      <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="100" 
                js-old-max
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
          <fieldset>
            <legend>new range</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="0" 
                js-new-min
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>      <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="1" 
                js-new-max
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
          <fieldset>
            <legend>value</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="1" 
                js-value
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
        </div>
        
          <button
            class="button button-secondary  "
            js-calculate
          >
              <span class="button-label">CALCULATE</span>
          </button>
      
        <component
          cmp="InputText"
          
        >
          
          <input
            type="text"
            
            js-calculation-output readonly
          />
        </component></view>    <view id="random-int" cmp="RandomInt" data-title="Random Int">
        <div class="inputs-wrapper">
          <fieldset>
            <legend>range</legend>
            <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="0" 
                js-min
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>      <component
              cmp="InputNumber"
              
            >
              
              <input
                type="number"
                
                
                 value="1" 
                js-max
              />
              <div class="input-controls">
                <button js-up>
                  <div
                    class="micon "
                    name="chevron-up"
                  ></div>    </button>
                <button js-down>
                  <div
                    class="micon "
                    name="chevron-down"
                  ></div>    </button>
              </div>
            </component>    </fieldset>
        </div>
          <button
            class="button button-secondary  "
            js-generate
          >
              <span class="button-label">GENERATE</span>
          </button>
        <component
          cmp="InputText"
          
        >
          
          <input
            type="text"
            
            js-generate-output readonly
          />
        </component></view>  </main>
  </body>  
</html>
